<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品扫码查询系统</title>
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; min-height: 100vh; }
        #reader {
            width: 100%; max-width: 400px; margin: 0 auto;
            border-radius: 16px; overflow: hidden;
            border: 4px solid white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        #reader__dashboard_section_csr button {
            background-color: #2563eb; color: white; padding: 6px 12px;
            border-radius: 6px; font-size: 14px; margin-top: 8px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-2">
            <h1 class="text-2xl font-bold text-slate-800">商品自助查询</h1>
            <p class="text-slate-500 text-xs">基于 Markdown 数据库</p>
        </header>

        <div id="reader"></div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex gap-2">
                <input type="text" id="manual-input" placeholder="输入条码..." 
                       class="flex-1 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="window.handleManualSearch()" class="bg-slate-800 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-sm">查询</button>
            </div>
        </div>

        <div id="product-card" class="hidden space-y-4">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                <div class="aspect-square bg-white flex items-center justify-center p-8">
                     <img id="product-image" src="" class="max-w-full max-h-full object-contain">
                </div>
                
                <div class="p-6 border-t border-slate-50">
                    <span id="product-type" class="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-bold rounded uppercase"></span>
                    <h2 id="product-name" class="text-xl font-bold text-slate-900 mt-2"></h2>
                    
                    <p id="product-desc" class="text-sm text-slate-500 mt-3 leading-relaxed bg-slate-50 p-3 rounded-lg"></p>
                    
                    <div class="flex items-center justify-between mt-6">
                        <div>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">条码: <span id="product-barcode"></span></p>
                            <p class="text-slate-900 font-bold">零售价</p>
                        </div>
                        <div class="text-3xl font-black text-blue-600 italic">
                            <span class="text-lg">¥</span><span id="product-price"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button onclick="window.resetSearch()" class="w-full py-3 text-slate-500 text-xs font-bold bg-slate-200/50 rounded-xl">
                返回重扫
            </button>
        </div>

        <div id="error-message" class="hidden p-4 bg-red-50 text-red-600 rounded-2xl text-center text-xs font-bold border border-red-100">
            数据库中不存在该商品信息
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
